<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#123A5E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- blueprint grid texture -->
  <g stroke="#EAF6FF" stroke-width="1" opacity="0.05">
    <line x1="0" y1="30" x2="1200" y2="30"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="60" y1="0" x2="60" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="330" y1="0" x2="330" y2="300"/>
    <line x1="420" y1="0" x2="420" y2="300"/>
    <line x1="510" y1="0" x2="510" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="690" y1="0" x2="690" y2="300"/>
    <line x1="780" y1="0" x2="780" y2="300"/>
    <line x1="870" y1="0" x2="870" y2="300"/>
    <line x1="960" y1="0" x2="960" y2="300"/>
    <line x1="1050" y1="0" x2="1050" y2="300"/>
    <line x1="1140" y1="0" x2="1140" y2="300"/>
  </g>

  <!-- corner crosshair, blueprint-annotation flavor -->
  <g stroke="#5EEAD4" stroke-width="1.5" opacity="0.5">
    <line x1="40" y1="40" x2="40" y2="56"/>
    <line x1="32" y1="48" x2="48" y2="48"/>
  </g>
  <g stroke="#5EEAD4" stroke-width="1.5" opacity="0.5">
    <line x1="1160" y1="244" x2="1160" y2="260"/>
    <line x1="1152" y1="252" x2="1168" y2="252"/>
  </g>

  <!-- wordmark -->
  <text x="60" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#F7FBFF" letter-spacing="-1">Formento</text>
  <text x="60" y="176" font-family="ui-monospace, 'SF Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#5EEAD4" letter-spacing="2.5">REBUILD LEGACY SOFTWARE FROM A CLEAN SPEC</text>
  <text x="60" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9FC4DE">Point it at an existing codebase &#8594; get a reviewed, redeployable rebuild.</text>

  <!-- pipeline diagram -->
  <g font-family="ui-monospace, 'SF Mono', Consolas, 'Courier New', monospace" font-size="11" font-weight="600" letter-spacing="1.2">
    <line x1="660" y1="150" x2="1140" y2="150" stroke="#5EEAD4" stroke-width="1.5" opacity="0.55"/>

    <circle cx="660" cy="150" r="7" fill="#0A2540" stroke="#5EEAD4" stroke-width="2"/>
    <text x="660" y="182" fill="#BFE3F0" text-anchor="middle">INTENT</text>

    <circle cx="756" cy="150" r="7" fill="#0A2540" stroke="#5EEAD4" stroke-width="2"/>
    <text x="756" y="182" fill="#BFE3F0" text-anchor="middle">SCHEMA</text>

    <circle cx="852" cy="150" r="7" fill="#0A2540" stroke="#5EEAD4" stroke-width="2"/>
    <text x="852" y="182" fill="#BFE3F0" text-anchor="middle">UI</text>

    <circle cx="948" cy="150" r="7" fill="#0A2540" stroke="#5EEAD4" stroke-width="2"/>
    <text x="948" y="182" fill="#BFE3F0" text-anchor="middle">BACKEND</text>

    <circle cx="1044" cy="150" r="7" fill="#0A2540" stroke="#5EEAD4" stroke-width="2"/>
    <text x="1044" y="182" fill="#BFE3F0" text-anchor="middle">INTEGRATE</text>

    <circle cx="1140" cy="150" r="8" fill="#5EEAD4" stroke="#5EEAD4" stroke-width="2"/>
    <text x="1140" y="182" fill="#5EEAD4" text-anchor="middle">DEPLOY</text>
  </g>

  <text x="660" y="120" font-family="ui-monospace, 'SF Mono', Consolas, 'Courier New', monospace" font-size="10" fill="#5A7C92" letter-spacing="1.5">PHASE 0</text>
  <text x="1140" y="120" font-family="ui-monospace, 'SF Mono', Consolas, 'Courier New', monospace" font-size="10" fill="#5A7C92" letter-spacing="1.5" text-anchor="end">PHASE 5</text>
</svg>
